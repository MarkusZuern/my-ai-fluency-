<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Fluency Diagnostic | Markus Zürn</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#264438" />
  <style>
    :root {
      /* Markus Zürn Brand Book — Brunswick Green / Warm Linen / Obsidian Black / Pure White */
      --bg: #111111; --bg-2: #16211b; --panel: #eae5db;
      --text: #ffffff; --muted: rgba(234,229,219,.72); --accent: #264438;
      --accent-2: #4f7d64; --radius: 22px;
      --font-primary: 'Trebuchet MS', 'Trebuchet', 'Century Gothic', sans-serif;
      --font-secondary: 'Inter', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font-secondary); color: var(--text);
      background: radial-gradient(circle at top left, rgba(38,68,56,.35), transparent 28%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); min-height: 100vh;
    }
    .wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .card { background: rgba(234,229,219,.04); border: 1px solid rgba(234,229,219,.12);
      border-radius: var(--radius); padding: 35px; backdrop-filter: blur(10px); margin-bottom: 24px; }
    .eyebrow { font-family: var(--font-primary); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 10px; font-weight: 700; }
    h1 { font-family: var(--font-primary); font-size: clamp(32px, 5vw, 48px); margin: 0 0 15px; line-height: 1.1; color: var(--text); }
    h2 { font-family: var(--font-primary); }
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 25px; }
    .option { width: 100%; text-align: left; padding: 18px; border-radius: 14px; border: 1px solid rgba(234,229,219,.12);
      background: rgba(234,229,219,.05); color: var(--text); cursor: pointer; transition: 0.2s; font-size: 16px; font-family: var(--font-secondary); }
    .option:hover { background: rgba(38,68,56,0.35); border-color: var(--accent-2); transform: translateY(-2px); }
    .progress-bar { width: 100%; height: 8px; background: rgba(234,229,219,.12); border-radius: 10px; margin: 25px 0; }
    .progress-fill { height: 100%; background: var(--accent-2); width: 0%; transition: 0.4s; }
    .result { display: none; }
    .result.show { display: block; }
    .viz-container { display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: 25px; width: 100%; }
    canvas { max-width: 100%; height: auto; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.4)); }
    .insight-box { border-left: 4px solid var(--accent-2); padding: 20px; margin: 25px 0; background: rgba(38,68,56,0.12); color: var(--muted); line-height: 1.7; border-radius: 0 15px 15px 0; }
    .signature { font-family: var(--font-primary); text-align: right; font-size: 13px; color: var(--accent-2); margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .brand-mark { display: flex; justify-content: center; margin-bottom: 24px; }
    .brand-mark img { height: 22px; width: auto; opacity: .92; }
    .sig-logo { height: 15px; width: auto; vertical-align: -2px; opacity: .85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand-mark"><img src="assets/zurn-logo.png" alt="Zürn" /></div>
    <div id="quizContainer">
      <section class="card">
        <div class="eyebrow" id="counter">Initialization</div>
        <div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
        <h2 id="qText" style="font-size: 28px;">Which AI ecosystem do you primarily utilize?</h2>
        <div class="btn-grid" id="options"></div>
      </section>
    </div>

    <div class="result" id="resScreen">
      <section class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 20px;">
          <div class="eyebrow">Executive Diagnostic Result</div>
          <div class="signature">By <img src="assets/zurn-logo.png" alt="Zürn" class="sig-logo" /></div>
        </div>
        <div style="display:flex; align-items: baseline; gap: 20px; margin-bottom: 20px;">
          <h1 id="resScore" style="font-size: 82px; margin:0;">0/100</h1>
          <h2 id="resTier" style="color: var(--accent-2); margin:0; font-size: 24px;">Tier</h2>
        </div>
        <div class="insight-box" id="resInsight"></div>
        
        <div class="viz-container">
          <canvas id="radar" width="500" height="500"></canvas>
        </div>
        
        <button class="option" style="text-align:center; margin-top:40px; border-color: var(--accent); font-weight: bold;" onclick="location.reload()">Restart Diagnostic</button>
      </section>
    </div>
  </div>

  <script>
    const tools = ["ChatGPT", "Perplexity", "Mistral", "Gemini", "Claude", "Multimodal / All"];
    const questions = [
      { label: 'Iteration', text: 'Output Revision: How do you treat the first generated result?', options: [['Immediate acceptance', 1], ['Minor cosmetic tweaks', 2], ['Iterative refinement', 3], ['Structural redirection', 4], ['Recursive optimization', 5]] },
      { label: 'Endpoints', text: 'Strategic Definition: How clear is your "Definition of Done"?', options: [['Spontaneous prompt', 1], ['Directional drift', 2], ['Conceptual goal', 3], ['Explicit objective', 4], ['Full success metrics', 5]] },
      { label: 'Constraints', text: 'Guardrail Settings: Specificity of format, tone, and length?', options: [['Zero constraints', 1], ['Reactive fixing', 2], ['Partial parameters', 3], ['Predefined style-sheet', 4], ['Strict structural brief', 5]] },
      { label: 'Examples', text: 'Few-Shot Learning: Do you provide reference materials?', options: [['Abstract description', 1], ['Occasional reference', 2], ['Task-specific examples', 3], ['Contextual draft injection', 4], ['Mandatory Gold-Standard', 5]] },
      { label: 'Reasoning', text: 'Logic Interrogation: Do you ask the AI to justify recommendations?', options: [['Implicit trust', 1], ['Conflict-based inquiry', 2], ['Occasional probing', 3], ['Systematic skepticism', 4], ['Mandatory stress-testing', 5]] },
      { label: 'Detection', text: 'Error Vigilance: How frequently do you identify hallucinations?', options: [['Rarely identified', 1], ['Surface error catch', 2], ['Logic gap detection', 3], ['Active anomaly hunting', 4], ['Comprehensive audit', 5]] },
      { label: 'Verification', text: 'Fact-Check Reflex: Do you validate polished factual claims?', options: [['No validation', 1], ['Surface skimming', 2], ['Selective deep-dives', 3], ['Systematic verification', 4], ['Rigorous audit protocol', 5]] },
      { label: 'Framing', text: 'Session Architecture: Do you define a specific persona or role?', options: [['Transactional ask', 1], ['Reactive rules', 2], ['Partial framing', 3], ['Deliberate role design', 4], ['Full cognitive framing', 5]] },
      { label: 'Mode', text: 'Cognitive Load: Is AI a tool or a thinking partner?', options: [['Utility machine', 1], ['Basic collaborator', 2], ['Task-dependent peer', 3], ['Active co-creator', 4], ['Strategic partner', 5]] },
      { label: 'Context', text: 'Data Density: Amount of background provided per session?', options: [['Minimal context', 1], ['Brief background', 2], ['Relevant datasets', 3], ['Rich context architecture', 4], ['Total knowledge loading', 5]] },
      { label: 'Skepticism', text: 'Critical Distance: Does professional prose lower your guard?', options: [['Polish = Quality', 1], ['Trusting professional tone', 2], ['Maintained attention', 3], ['Heightened scrutiny', 4], ['Aggressive pressure-test', 5]] },
      { label: 'Reflection', text: 'Metacognition: Do you study your own prompting behavior?', options: [['Zero reflection', 1], ['Loose awareness', 2], ['Pattern recognition', 3], ['Deliberate adjustment', 4], ['Continuous improvement', 5]] }
    ];

    const tiers = [
      { min: 0, max: 32, name: 'AI Beginner', insight: 'Your usage is transactional. You treat AI as a faster search engine. Focus on defining "Success Metrics" before your first keystroke to double your output quality.' },
      { min: 33, max: 56, name: 'AI User', insight: 'You have instincts but lack systematic structure. You iterate when things go wrong; the next level is front-loading constraints to prevent errors before they happen.' },
      { min: 57, max: 80, name: 'AI Operator', insight: 'You perform above the median, but likely settle for "good enough" results. Move from checking prose to systematically stress-testing the AI’s underlying logic.' },
      { min: 81, max: 92, name: 'AI Advanced', insight: 'You think like a strategist. You provide rich context and clear goals. Your upgrade is standardizing these behaviors into consistent prompt templates for your teams.' },
      { min: 93, max: 100, name: 'AI Architect', insight: 'You occupy the top 1% of practitioners. You treat AI as a cognitive peer, maintain rigorous factual standards, and reflect deeply on your own operational patterns.' }
    ];

    let current = -1; let ans = [];

    function update() {
      const opts = document.getElementById('options'); opts.innerHTML = '';
      if (current === -1) {
        tools.forEach(t => {
          const b = document.createElement('button'); b.className='option'; b.innerText=t;
          b.onclick = () => { current++; update(); }; opts.appendChild(b);
        });
      } else {
        const q = questions[current];
        document.getElementById('counter').innerText = `Diagnostic: ${current + 1} / 12`;
        document.getElementById('bar').style.width = `${((current+1) / 12) * 100}%`;
        document.getElementById('qText').innerText = q.text;
        q.options.forEach(o => {
          const b = document.createElement('button'); b.className='option'; b.innerText=o[0];
          b.onclick = () => { ans.push(o[1]); if(++current < 12) update(); else finish(); };
          opts.appendChild(b);
        });
      }
    }

    function finish() {
      document.getElementById('quizContainer').style.display = 'none';
      const score = Math.round((ans.reduce((a,b)=>a+b,0) / 60) * 100);
      const tier = tiers.find(t => score >= t.min && score <= t.max);
      document.getElementById('resScore').innerText = `${score}/100`;
      document.getElementById('resTier').innerText = tier.name;
      document.getElementById('resInsight').innerText = tier.insight;
      document.getElementById('resScreen').classList.add('show');
      drawRadar(ans);
    }

    function drawRadar(data) {
      const c = document.getElementById('radar'); const ctx = c.getContext('2d');
      const cx = 250; const cy = 250; const r = 160;
      ctx.clearRect(0,0,500,500);
      
      ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
      for(let i=1; i<=5; i++) {
        ctx.beginPath();
        for(let j=0; j<12; j++) {
          const a = (j/12)*Math.PI*2 - Math.PI/2;
          ctx.lineTo(cx + Math.cos(a)*(r*i/5), cy + Math.sin(a)*(r*i/5));
        }
        ctx.closePath(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillText(i, cx + 5, cy - (r*i/5));
      }

      ctx.fillStyle = 'rgba(234,229,219,0.8)'; ctx.font = 'bold 11px Inter'; ctx.textAlign = 'center';
      questions.forEach((q, i) => {
        const a = (i/12)*Math.PI*2 - Math.PI/2;
        const x = cx + Math.cos(a)*(r + 40); const y = cy + Math.sin(a)*(r + 40);
        ctx.fillText(q.label, x, y);
      });

      ctx.beginPath(); ctx.strokeStyle = '#4f7d64'; ctx.fillStyle = 'rgba(38,68,56,0.45)'; ctx.lineWidth = 3;
      data.forEach((v, i) => {
        const a = (i/12)*Math.PI*2 - Math.PI/2;
        ctx.lineTo(cx + Math.cos(a)*(r*v/5), cy + Math.sin(a)*(r*v/5));
      });
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    update();
  </script>
</body>
</html>
